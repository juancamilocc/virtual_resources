apisix:
  nginx_config:
    http:
      client_max_body_size: "10m"              
      client_body_buffer_size: "1m"
      client_header_timeout: "60s"
      client_body_timeout: "60s"
      send_timeout: "60s"
      keepalive_timeout: "65s"           
    main:
      worker_processes: "auto"
      worker_rlimit_nofile: 65535
  ssl:
    enabled: true
    containerPort: 9443 

  customLuaSharedDicts:
    - name: poly-cache
      size: 10m
    
gateway:
  type: NodePort
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
  tls:
    enabled: true
    servicePort: 443
    containerPort: 9443

ingress-controller:
  enabled: true
  config:
    kubernetes:
      ingressClass: apisix
      ingressVersion: apisix.apache.org/v2
      watchNamespace: "*"
      enableNamespaceSelector: false
      namespaces: [] 
      apisixRouteRootNamespace: ingress-apisix
    
  apisix:
    adminService:
      namespace: ingress-apisix
    adminServerAddress: "http://apisix-admin.ingress-apisix.svc.cluster.local:9180/apisix/admin"
    adminKey: "edd1c9f034335f136f87ad84b625c8f1"

  gatewayProxy:
    createDefault: true

dashboard:
  enabled: true